[project]
name = "attendance-automation-hub"
version = "0.1.0"
description = "Standalone Windows and Android attendance automation with secure private remote control"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
